name: build-and-deploy

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - '.github/**'
      - 'meta.json'
      - 'plugins.json'
      - 'tags.json'
  release:
    types:
      - published
  workflow_dispatch:

# Pages 与 OIDC 令牌供发布步骤使用;本流程不再把分发内容提交回仓库,因此不需要写权限。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# 本仓库由 dsc 直接签名发布,信任分两层:
#   1. 整站签名: 用网页 EEC 给 dist/ 内每个 .html/.js/.css/.json 文件签 CMS 分离签名,
#      市场校验的是本仓库 Pages 页面的签名数据,而不是「合集 EEC 签发插件」那套;
#   2. 作者签名: dsc 作为插件作者用 Ed25519 只给每个版本的 plugin.js 签 plugin.js.author.sig;
#      多位签名者依次为 plugin.js.author.sig.<序号>,配 plugins/<作者>/author_pub.<序号>.pem。
#
# 私钥只来自 secrets:
#   secrets.DSC_INNER_PLUGIN_EEC_SECRET            网页 EEC 私钥(ECDSA P-256),只在本流程内存中出现;
#   secrets.DSC_INNER_PLUGIN_EEC           网页 EEC 证书 PEM 文本,公开材料,随 dist/eec.pem 分发;
#   secrets.DS_CHAT_ROOT_CA            根证书 PEM 文本,可选,用于签名后自检证书链;
#   secrets.AUTHOR_OMDS_CHAT_SECRET 作者私钥(Ed25519),只透传给插件构建产出作者签名。
# 根证书私钥属于离线签名环境,绝不出现在本流程。
env:
  DSC_INNER_PLUGIN_EEC_SECRET: ${{ secrets.DSC_INNER_PLUGIN_EEC_SECRET }}
  DSC_INNER_PLUGIN_EEC: ${{ secrets.DSC_INNER_PLUGIN_EEC }}
  ROOT_CA_PEM: ${{ secrets.DS_CHAT_ROOT_CA }}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 作者签名由插件仓库的构建产出,构建读取下面两个变量:
    #   AUTHOR_SIGN_ENABLE= true 时才会签名,其他取值视为关闭;
    #   AUTHOR_SIGN_PRIVATE_KEY 未配置时把开关降为 false,如实降级为不签名并给出警告,不让构建失败。
    env:
      AUTHOR_SIGN_ENABLE: "${{ secrets.AUTHOR_OMDS_CHAT_SECRET != '' && 'true' || 'false' }}"
      AUTHOR_SIGN_PRIVATE_KEY: "${{ secrets.AUTHOR_OMDS_CHAT_SECRET }}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Check OpenSSL
        run: openssl version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 按 .github/plugins-sources.json 收录插件;清单为空时脚本直接返回 0。
      # 收录只复制作者侧分离签名 plugin.js.author.sig(多签 .2/.3)与作者公钥 author_pub.pem(多签 .2.pem/.3.pem),
      # 不生成任何合集签名;产物没带作者签名时只警告,该版本仍有整站签名。
      # 搬产物前先对 dist/plugin.js 做产物静态扫描: 命中 PLUGIN_NETWORK_SELFTALK 只记警告,收录照常继续。
      - name: Import plugins
        run: |
          set -euo pipefail
          if [ -z "${AUTHOR_SIGN_PRIVATE_KEY:-}" ]; then
            echo "::warning::secrets.AUTHOR_OMDS_CHAT_SECRET 未配置,插件构建不产出作者签名,本次收录只有整站签名"
          fi
          node scripts/import-plugins.mjs --manifest .github/plugins-sources.json

      # 自洽性校验: 索引数据、作者公钥、作者签名与版本目录结构。
      # 作者签名逐位签名者校验,失败只记警告、不阻断(全组织口径);索引结构错误才失败。
      # 同时静态扫描每个版本的 plugin.js: 插件不得自建网络通道,命中 PLUGIN_NETWORK_SELFTALK 只记警告,不阻断。
      # 这一步不涉及证书链: 插件文件不再由合集 EEC 签名,整站签名在下面的步骤里做。
      - name: Verify collection
        run: pnpm verify

      - name: Build distribution
        run: pnpm build

      # 整站签名: 用网页 EEC 给 dist/ 内全部 .html/.js/.css/.json 文件签 CMS 分离签名,
      # 产出 <文件>.sig、web_files.json 及其签名,并把证书复制为 dist/eec.pem。
      # 本地缺少密钥时 sign-site.mjs 只警告并保留未签名 dist;CI 用 --require-key 视为错误。
      - name: Sign site
        run: |
          set -euo pipefail
          if [ -z "${DSC_INNER_PLUGIN_EEC_SECRET:-}" ]; then
            echo "::error::缺少 secrets.DSC_INNER_PLUGIN_EEC_SECRET,无法对 dist/ 做整站签名"
            exit 1
          fi
          if [ -z "${DSC_INNER_PLUGIN_EEC:-}" ]; then
            echo "::error::缺少 secrets.DSC_INNER_PLUGIN_EEC,需要网页 EEC 证书 PEM 文本"
            exit 1
          fi
          cert="$RUNNER_TEMP/web-eec.pem"
          printf '%s\n' "$DSC_INNER_PLUGIN_EEC" > "$cert"
          node scripts/sign-site.mjs --dir dist --eec "$cert" --require-key

      # 发布前自检: 清单签名、逐文件签名、清单覆盖率与孤儿签名。
      # 有根证书时同时校验网页 EEC 的证书链,没有时只做完整性校验并给出警告。
      - name: Verify site signatures
        run: |
          set -euo pipefail
          if [ -n "${ROOT_CA_PEM:-}" ]; then
            root="$RUNNER_TEMP/root_ca.crt"
            printf '%s\n' "$ROOT_CA_PEM" > "$root"
            node scripts/verify-site.mjs --dir dist --root-ca "$root"
          else
            echo "::warning::未设置 secrets.DS_CHAT_ROOT_CA,只做签名完整性校验,未验证证书链"
            node scripts/verify-site.mjs --dir dist
          fi

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
